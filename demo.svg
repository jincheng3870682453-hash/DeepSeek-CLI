<svg xmlns="http://www.w3.org/2000/svg" width="425" height="253" viewBox="0 0 425 253" font-family="Consolas, 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14">
  <rect x="2" y="2" width="421" height="249" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <circle cx="30" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="47" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="64" cy="17" r="5.5" fill="#27c93f"/>
  <text x="80" y="22" fill="#8b949e" font-size="12">deepseek — DeepSeek CLI</text>

  <!-- selection highlight bar (animated) -->
  <rect x="16" y="57" width="381" height="21" rx="4" fill="rgba(77,107,254,0.28)">
    <animate attributeName="y" from="57" to="162" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1" values="57;162;57"/>
  </rect>

  <!-- menu cursor (animated) -->
  <text x="24" y="69" fill="#5ac8fa" font-weight="bold">
    ❯
    <animate attributeName="y" from="69" to="174" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1" values="69;174;69"/>
  </text>

  <text x="24" y="48" fill="#e6edf3">启动配置</text>
  <text x="24" y="69" fill="#e6edf3"> ❯ 权限模式      工作区写入</text>
  <text x="24" y="90" fill="#e6edf3">   工作目录      C:\Users\69215\Desktop</text>
  <text x="24" y="111" fill="#e6edf3">   模型          DeepSeek-V4-Flash</text>
  <text x="24" y="132" fill="#e6edf3">   显示思考过程  关</text>
  <text x="24" y="153" fill="#e6edf3">   API Key      已配置</text>
  <text x="24" y="174" fill="#5fdca0">   ▶ 开始对话</text>
  <text x="24" y="195" fill="#8b949e">↑↓ 选择 · Enter 确认 · 数字直接选 · q 返回</text>
  <text x="24" y="216" fill="#5ac8fa">❯ </text>

  <!-- blinking input caret next to the prompt -->
  <rect x="41.36" y="218" width="9" height="11" fill="#5ac8fa">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
